facts:
  - emoji: ♟️
    label: Chess
    text: >-
      I play chess, but sometimes think five moves ahead when one would have
      been enough.
  - emoji: 🧠
    label: Curiosity
    text: >-
      One random question can easily turn into three hours of researching things
      I didn’t plan to learn.
  - emoji: 🛠️
    label: Side Projects
    text: >-
      I’m very good at turning “this should be a quick project” into a
      completely unnecessary weekend commitment.
  - emoji: 🌙
    label: Late Nights
    text: >-
      Some of my best ideas show up at exactly the time I should probably be
      sleeping.
  - emoji: 🎥
    label: Video Editing
    text: >-
      I can spend an hour editing a 20-second clip because “one more tweak”
      never means one more tweak.
