beats:
  - >-
    I learn by building — taking something apart, understanding how it works,
    and pushing it beyond the obvious solution.
  - >
    I build across the stack — from interfaces and interactions to the systems
    behind them.
  - >-
    The technologies change from project to project. The goal stays the same:
    build something worth using.
  - >-
    I care about more than making something functional. The details matter: how
    it behaves, how it feels, and how clearly it communicates.
